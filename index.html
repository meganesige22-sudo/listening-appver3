<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>英語リスニング学習アプリ</title>
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Listening Study">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* スムーズかつ自然なハイライトアニメーション */
        .sentence-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .sentence-card.active {
            background-color: #eff6ff; /* blue-50 */
            border-color: #3b82f6; /* blue-500 */
            box-shadow: 0 4px 12px -2px rgba(59, 130, 246, 0.15);
            transform: scale(1.01);
        }

        /* スクロールバーのカスタマイズ */
        #subtitles-container::-webkit-scrollbar {
            width: 6px;
        }
        #subtitles-container::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        #subtitles-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        #subtitles-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between selection:bg-blue-200">

    <!-- ヘッダー -->
    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-20">
        <div class="max-w-xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-lg bg-white/20 flex items-center justify-center font-bold text-white text-base">
                    🎧
                </div>
                <h1 class="text-lg font-bold tracking-tight">Listening Study</h1>
            </div>
            <div class="flex items-center space-x-2">
                <button id="install-guide-btn" class="bg-white/10 hover:bg-white/20 active:bg-white/30 text-xs px-2.5 py-1.5 rounded-lg font-medium transition backdrop-blur-sm flex items-center space-x-1">
                    <span>📱 ホーム追加</span>
                </button>
                <button id="toggle-input-btn" class="bg-white text-blue-600 hover:bg-blue-50 font-semibold text-xs px-3 py-1.5 rounded-lg transition shadow-sm">
                    英文設定
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto w-full p-4 space-y-4 flex-1">

        <!-- ホーム画面追加の案内モーダル -->
        <div id="install-modal" class="bg-blue-50 border border-blue-200 p-4 rounded-2xl text-xs text-blue-900 hidden space-y-2 shadow-sm animate-fade-in">
            <div class="flex justify-between items-center font-bold text-sm">
                <span class="flex items-center space-x-1">
                    <span>💡</span>
                    <span>ホーム画面への追加方法</span>
                </span>
                <button id="close-modal-btn" class="text-blue-400 hover:text-blue-700 w-6 h-6 flex items-center justify-center text-lg rounded-full">✕</button>
            </div>
            <p class="text-blue-800 leading-relaxed">アプリ感覚ですぐ起動できるようにスマホのホーム画面に追加できます。</p>
            <ul class="list-disc pl-5 space-y-1 text-blue-800">
                <li><strong>iPhone (Safari):</strong> 画面下の共有ボタン ➔ 「ホーム画面に追加」</li>
                <li><strong>Android (Chrome):</strong> 画面右上のメニュー ➔ 「ホーム画面に追加」</li>
            </ul>
        </div>

        <!-- 英文入力エリア -->
        <section id="input-section" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 hidden transition-all duration-300">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center space-x-1">
                    <span>✍️</span>
                    <span>英文テキスト入力</span>
                </h2>
                <button id="paste-btn" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 text-xs px-2.5 py-1.5 rounded-lg font-medium transition flex items-center space-x-1">
                    <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                    <span>貼り付け</span>
                </button>
            </div>
            <div class="space-y-3">
                <textarea id="english-input" rows="6" class="w-full p-3.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:outline-none transition leading-relaxed" placeholder="ここに英語のテキストを入力してください..."></textarea>
                
                <div class="flex space-x-2">
                    <button id="save-btn" class="flex-1 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium py-2.5 rounded-xl text-sm transition shadow-sm flex items-center justify-center space-x-1">
                        <span>保存してスクリプトを更新</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- 字幕表示エリア -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden flex flex-col" style="height: calc(100vh - 280px); min-height: 380px;">
            <div class="px-4 py-3 bg-slate-50 border-b border-slate-100 text-xs font-semibold text-slate-500 flex justify-between items-center shrink-0">
                <span class="flex items-center space-x-1.5">
                    <span class="w-2 h-2 rounded-full bg-blue-500 inline-block"></span>
                    <span>スクリプト（タップで再生）</span>
                </span>
                <span id="current-position-label" class="bg-slate-200/70 text-slate-600 font-mono px-2 py-0.5 rounded-full text-[11px]">0 / 0</span>
            </div>
            <div id="subtitles-container" class="p-3 space-y-2.5 overflow-y-auto flex-1 scroll-smooth">
                <div class="text-center text-slate-400 py-12 text-sm">
                    読み込み中...
                </div>
            </div>
        </section>

    </main>

    <!-- 固定コントロール（画面下部） -->
    <footer class="sticky bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 p-4 shadow-lg z-30">
        <div class="max-w-xl mx-auto space-y-3">
            
            <!-- プログレスバー -->
            <div class="flex items-center space-x-2 px-1">
                <input type="range" id="progress-bar" min="0" max="100" value="0" class="w-full accent-blue-600 h-1.5 bg-slate-200 rounded-lg cursor-pointer">
            </div>

            <!-- メインコントローラー -->
            <div class="flex items-center justify-around px-2">
                
                <!-- 制御ボタン群 -->
                <div class="flex items-center space-x-6">
                    <!-- 前へ -->
                    <button id="prev-btn" class="p-2.5 text-slate-600 hover:text-blue-600 active:scale-95 transition flex flex-col items-center" title="前の文へ">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/></svg>
                        <span class="text-[10px] text-slate-400 mt-0.5">前へ</span>
                    </button>

                    <!-- 再生 / 一時停止 -->
                    <button id="play-pause-btn" class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white p-4 rounded-full shadow-md hover:shadow-lg transition flex items-center justify-center transform active:scale-95 focus:outline-none" title="再生 / 一時停止">
                        <svg id="play-icon" class="w-6 h-6 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        <svg id="pause-icon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </button>

                    <!-- 次へ -->
                    <button id="next-btn" class="p-2.5 text-slate-600 hover:text-blue-600 active:scale-95 transition flex flex-col items-center" title="次の文へ">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 5l7 7-7 7M5 5l7 7-7 7"/></svg>
                        <span class="text-[10px] text-slate-400 mt-0.5">次へ</span>
                    </button>
                </div>

                <!-- 再生速度 -->
                <div class="flex flex-col items-center">
                    <select id="rate-select" class="bg-slate-100 border border-slate-200 rounded-lg text-xs p-1.5 font-medium text-slate-700 focus:outline-none focus:ring-1 focus:ring-blue-500">
                        <option value="0.5">0.5x</option>
                        <option value="0.75">0.75x</option>
                        <option value="1" selected>1.0x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2.0x</option>
                    </select>
                    <span class="text-[10px] text-slate-400 mt-0.5">再生速度</span>
                </div>

            </div>
        </div>
    </footer>

    <!-- バックグラウンド維持用の隠しオーディオ要素 -->
    <audio id="bg-audio" loop playsinline style="display:none;"></audio>

    <script>
        const defaultEnglish = `Hello and welcome to this English listening practice session.
Regular input is the key to improving your listening skills.
Try to follow the subtitles as you listen to each sentence.
You can adjust the playback speed, repeat sentences, and review comfortably.
Let's make this a daily habit for better fluency!`;

        // DOM要素の参照
        const englishInput = document.getElementById('english-input');
        const saveBtn = document.getElementById('save-btn');
        const pasteBtn = document.getElementById('paste-btn');
        const inputSection = document.getElementById('input-section');
        const toggleInputBtn = document.getElementById('toggle-input-btn');
        const installGuideBtn = document.getElementById('install-guide-btn');
        const installModal = document.getElementById('install-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const subtitlesContainer = document.getElementById('subtitles-container');
        
        const playPauseBtn = document.getElementById('play-pause-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');

        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const rateSelect = document.getElementById('rate-select');
        const progressBar = document.getElementById('progress-bar');
        const currentPositionLabel = document.getElementById('current-position-label');

        const bgAudio = document.getElementById('bg-audio');

        // 状態変数
        let sentences = [];
        let currentIndex = 0;
        let isPlaying = false;

        // バックグラウンド維持用ダミー音声の作成
        function createSilentAudio() {
            const sampleRate = 8000;
            const numChannels = 1;
            const bitsPerSample = 16;
            const blockAlign = (numChannels * bitsPerSample) / 8;
            const byteRate = sampleRate * blockAlign;
            const dataSize = sampleRate * blockAlign * 1;
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);

            function writeString(view, offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitsPerSample, true);
            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);

            const blob = new Blob([view], { type: 'audio/wav' });
            bgAudio.src = URL.createObjectURL(blob);
        }

        // 初期化処理
        createSilentAudio();
        englishInput.value = localStorage.getItem('listening_eng') || defaultEnglish;
        parseAndRender();

        // イベントリスナー設定
        installGuideBtn.addEventListener('click', () => { installModal.classList.toggle('hidden'); });
        closeModalBtn.addEventListener('click', () => { installModal.classList.add('hidden'); });
        toggleInputBtn.addEventListener('click', () => {
            inputSection.classList.toggle('hidden');
            installModal.classList.add('hidden');
        });

        pasteBtn.addEventListener('click', async () => {
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    if (text) { 
                        englishInput.value = text; 
                    } else { 
                        showNotice('クリップボードにテキストがありません'); 
                    }
                } else {
                    showNotice('手動でテキストエリアにペーストしてください');
                }
            } catch (err) {
                showNotice('クリップボードの読み取り権限がありません');
            }
        });

        saveBtn.addEventListener('click', () => {
            localStorage.setItem('listening_eng', englishInput.value);
            parseAndRender();
            inputSection.classList.add('hidden');
            stopAudio();
        });

        function showNotice(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-16 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs px-4 py-2 rounded-full shadow-lg z-50 transition-opacity duration-300';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        // テキストの解析と描画
        function parseAndRender() {
            const engText = englishInput.value.trim();
            
            // 文区切りロジック
            sentences = engText ? engText.match(/[^.!?\n]+[.!?\n]*/g) || [engText] : [];
            sentences = sentences.map(s => s.trim()).filter(s => s.length > 0);

            subtitlesContainer.innerHTML = '';
            
            if (sentences.length === 0) {
                subtitlesContainer.innerHTML = '<div class="text-center text-slate-400 py-12 text-sm">英文が登録されていません。<br>「英文設定」から登録してください。</div>';
                currentPositionLabel.textContent = '0 / 0';
                return;
            }

            sentences.forEach((sent, idx) => {
                const div = document.createElement('div');
                div.className = `p-3.5 rounded-xl border border-slate-100 bg-white transition-all duration-200 cursor-pointer hover:border-slate-300 sentence-card ${idx === 0 ? 'active' : ''}`;
                div.dataset.index = idx;

                const flexDiv = document.createElement('div');
                flexDiv.className = 'flex items-start space-x-3';

                const numSpan = document.createElement('span');
                numSpan.className = 'text-xs font-semibold text-slate-300 font-mono mt-0.5 select-none w-5 shrink-0 text-right';
                numSpan.textContent = `${idx + 1}`;

                const engP = document.createElement('p');
                engP.className = 'text-sm sm:text-base font-medium text-slate-800 leading-relaxed break-words flex-1';
                engP.textContent = sent;

                flexDiv.appendChild(numSpan);
                flexDiv.appendChild(engP);
                div.appendChild(flexDiv);

                // 単語・文のタップ時処理
                div.addEventListener('click', () => {
                    currentIndex = idx;
                    playSentence(currentIndex);
                });

                subtitlesContainer.appendChild(div);
            });

            currentPositionLabel.textContent = `1 / ${sentences.length}`;
            updateProgress();
        }

        // 文の再生
        function playSentence(index) {
            if (index < 0 || index >= sentences.length) {
                stopAudio();
                return;
            }

            window.speechSynthesis.cancel();
            currentIndex = index;
            updateHighlight();

            // バックグラウンド音声を再生してオーディオセッションを維持
            bgAudio.play().catch(() => {});

            const textToSpeak = sentences[currentIndex];
            const currentUtterance = new SpeechSynthesisUtterance(textToSpeak);
            currentUtterance.lang = 'en-US';
            currentUtterance.rate = parseFloat(rateSelect.value);

            currentUtterance.onend = () => {
                if (!isPlaying) return;
                
                if (currentIndex < sentences.length - 1) {
                    playSentence(currentIndex + 1);
                } else {
                    stopAudio();
                }
            };

            currentUtterance.onerror = () => {
                stopAudio();
            };

            window.speechSynthesis.speak(currentUtterance);
            isPlaying = true;
            updatePlayButtonState();
            updateMediaSession(textToSpeak);
        }

        // MediaSession API設定（ロック画面・通知領域での制御）
        function updateMediaSession(text) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: `文 ${currentIndex + 1} / ${sentences.length}`,
                    artist: 'Listening Study',
                    album: text,
                });

                navigator.mediaSession.setActionHandler('play', () => {
                    if (!isPlaying) playSentence(currentIndex);
                });
                navigator.mediaSession.setActionHandler('pause', () => {
                    stopAudio();
                });
                navigator.mediaSession.setActionHandler('previoustrack', () => {
                    if (currentIndex > 0) playSentence(currentIndex - 1);
                });
                navigator.mediaSession.setActionHandler('nexttrack', () => {
                    if (currentIndex < sentences.length - 1) playSentence(currentIndex + 1);
                });
            }
        }

        /**
         * 画面全体の乱れを防ぐ字幕コンテナ専用スクロール処理
         * scrollIntoView() の代わりに、#subtitles-container の内部 scrollTop のみを変更
         */
        function scrollContainerToActiveItem(activeItem) {
            if (!activeItem || !subtitlesContainer) return;

            const containerHeight = subtitlesContainer.clientHeight;
            const itemTop = activeItem.offsetTop - subtitlesContainer.offsetTop;
            const itemHeight = activeItem.clientHeight;

            // アイテムがコンテナの中央付近に配置されるように計算
            const targetScrollTop = itemTop - (containerHeight / 2) + (itemHeight / 2);

            subtitlesContainer.scrollTo({
                top: Math.max(0, targetScrollTop),
                behavior: 'smooth'
            });
        }

        // ハイライトとスクロール位置の更新
        function updateHighlight() {
            const items = subtitlesContainer.querySelectorAll('.sentence-card');
            let activeElement = null;

            items.forEach((item, idx) => {
                if (idx === currentIndex) {
                    item.classList.add('active');
                    activeElement = item;
                } else {
                    item.classList.remove('active');
                }
            });

            if (activeElement) {
                scrollContainerToActiveItem(activeElement);
            }

            currentPositionLabel.textContent = `${currentIndex + 1} / ${sentences.length}`;
            updateProgress();
        }

        function updateProgress() {
            if (sentences.length === 0) {
                progressBar.value = 0;
                return;
            }
            const progress = (currentIndex / Math.max(1, sentences.length - 1)) * 100;
            progressBar.value = isNaN(progress) ? 0 : progress;
        }

        function stopAudio() {
            window.speechSynthesis.cancel();
            bgAudio.pause();
            isPlaying = false;
            updatePlayButtonState();
        }

        function updatePlayButtonState() {
            if (isPlaying) {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            }
        }

        // ボタンイベント
        playPauseBtn.addEventListener('click', () => {
            if (sentences.length === 0) return;

            if (isPlaying) {
                stopAudio();
            } else {
                playSentence(currentIndex);
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                if (isPlaying) {
                    playSentence(currentIndex);
                } else {
                    updateHighlight();
                }
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < sentences.length - 1) {
                currentIndex++;
                if (isPlaying) {
                    playSentence(currentIndex);
                } else {
                    updateHighlight();
                }
            }
        });

        progressBar.addEventListener('input', (e) => {
            if (sentences.length === 0) return;
            const val = e.target.value;
            const newIndex = Math.round((val / 100) * (sentences.length - 1));
            currentIndex = newIndex;
            if (isPlaying) {
                playSentence(currentIndex);
            } else {
                updateHighlight();
            }
        });

        rateSelect.addEventListener('change', () => {
            if (isPlaying) {
                playSentence(currentIndex);
            }
        });
    </script>
</body>
</html>
