<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語リスニング学習アプリ</title>
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Listening Study">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .highlight {
            background-color: #fef08a;
            border-left: 4px solid #eab308;
            padding-left: 0.75rem;
            transition: all 0.2s ease;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-28">

    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-20">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold tracking-wide">Listening Study</h1>
            <div class="flex space-x-2">
                <button id="install-guide-btn" class="bg-blue-500 hover:bg-blue-700 text-xs px-2.5 py-1.5 rounded-lg font-medium transition" title="ホーム画面に追加する方法">
                    📱 ホームへ追加
                </button>
                <button id="toggle-input-btn" class="bg-blue-500 hover:bg-blue-700 text-xs px-3 py-1.5 rounded-lg font-medium transition">
                    英文設定
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-4">

        <div id="install-modal" class="bg-blue-50 border border-blue-200 p-4 rounded-xl text-xs text-blue-900 hidden space-y-2">
            <div class="flex justify-between items-center font-bold">
                <span>💡 ホーム画面への追加方法</span>
                <button id="close-modal-btn" class="text-blue-500 hover:text-blue-700 text-sm font-bold">×</button>
            </div>
            <p>このアプリをいつでもすぐ起動できるように、スマホのホーム画面に常駐させることができます。</p>
        </div>

        <section id="input-section" class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 hidden">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider">英文テキスト入力</h2>
                <button id="paste-btn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs px-2.5 py-1 rounded-md font-medium transition">
                    貼付け
                </button>
            </div>
            <textarea id="english-input" rows="5" class="w-full p-3 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
            <button id="save-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 mt-2 rounded-lg text-sm transition">
                保存して反映
            </button>
        </section>

        <section class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-3 bg-gray-100 border-b text-xs font-semibold text-gray-500 flex justify-between items-center">
                <span>スクリプト</span>
                <span id="current-position-label">0 / 0</span>
            </div>
            <div id="subtitles-container" class="p-4 space-y-3 max-h-[60vh] overflow-y-auto"></div>
        </section>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-3 shadow-lg z-30">
        <div class="max-w-xl mx-auto space-y-3">
            <input type="range" id="progress-bar" min="0" max="100" value="0" class="w-full accent-blue-600 cursor-pointer">
            <div class="flex items-center justify-between px-2">
                <button id="prev-btn" class="text-gray-600 hover:text-blue-600 transition"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/></svg></button>
                
                <!-- Play/Pause Toggle button -->
                <button id="toggle-play-btn" class="bg-blue-600 text-white p-4 rounded-full shadow-lg">
                    <svg id="play-icon" class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/></svg>
                    <svg id="pause-icon" class="w-8 h-8 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </button>

                <button id="next-btn" class="text-gray-600 hover:text-blue-600 transition"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"/></svg></button>
            </div>
        </div>
    </footer>

    <audio id="bg-audio" loop playsinline style="display:none;"></audio>

    <script>
        const englishInput = document.getElementById('english-input');
        const saveBtn = document.getElementById('save-btn');
        const togglePlayBtn = document.getElementById('toggle-play-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const bgAudio = document.getElementById('bg-audio');
        const subtitlesContainer = document.getElementById('subtitles-container');
        const currentPositionLabel = document.getElementById('current-position-label');

        let sentences = [];
        let currentIndex = 0;
        let isPlaying = false;
        let selectedVoice = null;

        // 音声リストの読み込み
        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            // iOS等で好みの英語音声を検索（例: Samantha, Alex, Danielなど）
            selectedVoice = voices.find(v => v.lang.includes('en-US') && v.name.includes('Samantha')) 
                         || voices.find(v => v.lang.includes('en-US')) 
                         || voices[0];
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        // Background audio hack
        function createSilentAudio() {
            const buffer = new Uint8Array([82,73,70,70,36,0,0,0,87,65,86,69,102,109,116,32,16,0,0,0,1,0,1,0,64,31,0,0,64,31,0,0,1,0,8,0,100,97,116,97,0,0,0,0]);
            bgAudio.src = URL.createObjectURL(new Blob([buffer], {type: 'audio/wav'}));
        }
        createSilentAudio();

        function parseAndRender() {
            const val = localStorage.getItem('listening_eng') || "Hello. How are you? I am doing great.";
            englishInput.value = val;
            sentences = val.match(/[^.!?\n]+[.!?\n]*/g)?.map(s => s.trim()).filter(s => s.length > 0) || [];
            subtitlesContainer.innerHTML = sentences.map((s, idx) => `
                <div class="p-3 border rounded-lg cursor-pointer sentence-item ${idx === 0 ? 'highlight' : ''}" data-index="${idx}">
                    <p class="text-sm font-medium">${s}</p>
                </div>
            `).join('');
            currentPositionLabel.textContent = `1 / ${sentences.length}`;
        }

        function playSentence(idx) {
            if (idx >= sentences.length) return stopPlayback();
            currentIndex = idx;
            document.querySelectorAll('.sentence-item').forEach((el, i) => el.classList.toggle('highlight', i === idx));
            
            const utter = new SpeechSynthesisUtterance(sentences[idx]);
            // iOS対応：音声を明示的に指定
            if (selectedVoice) utter.voice = selectedVoice;
            utter.lang = 'en-US';
            
            utter.onend = () => { if(isPlaying) playSentence(idx + 1); };
            window.speechSynthesis.speak(utter);
        }

        function stopPlayback() {
            window.speechSynthesis.cancel();
            isPlaying = false;
            playIcon.classList.remove('hidden');
            pauseIcon.classList.add('hidden');
        }

        togglePlayBtn.addEventListener('click', () => {
            if (isPlaying) {
                window.speechSynthesis.pause();
                isPlaying = false;
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            } else {
                if (window.speechSynthesis.paused) {
                    window.speechSynthesis.resume();
                } else {
                    bgAudio.play().catch(() => {});
                    playSentence(currentIndex);
                }
                isPlaying = true;
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            }
        });

        document.getElementById('prev-btn').addEventListener('click', () => playSentence(Math.max(0, currentIndex - 1)));
        document.getElementById('next-btn').addEventListener('click', () => playSentence(Math.min(sentences.length - 1, currentIndex + 1)));
        
        saveBtn.addEventListener('click', () => {
            localStorage.setItem('listening_eng', englishInput.value);
            parseAndRender();
        });

        parseAndRender();
    </script>
</body>
</html>
